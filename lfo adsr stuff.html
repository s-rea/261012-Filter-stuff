<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Start Stop Fun</title>
  </head>
  <body>
    <button id="Start1">Start1</button>
    <button id="Start2">Start2</button>
    <input
      id="freq"
      type="range"
      min="1"
      max="40"
      step="0.1"
      value="0.1"
    /><label id="CutOff_Display">CutOff_Range</label>
    <input
      id="rate"
      type="range"
      min="0.125"
      max="10"
      step="0.001"
      value="3"
    /><label id="Rate_Display">Rate_Range</label>
    <script>
      //adsr swell 1
      const adsrSwell1 = function () {
        mainOsc1.frequency.value = Math.random() * 200 + 100;

        ctx.resume();

        let now = ctx.currentTime;

        adsr.gain.setValueAtTime(0, now);
        adsr.gain.linearRampToValueAtTime(1, now + 1.5);
        adsr.gain.exponentialRampToValueAtTime(0.0001, now + 5);
      };

      //adsr swell 2
      const adsrSwell2 = function () {
        mainOsc2.frequency.value = Math.random() * 200 + 100;
        ctx.resume();

        let now = ctx.currentTime;
        adsr.gain.setValueAtTime(0, now);
        adsr.gain.linearRampToValueAtTime(1, now + 1.5);
        adsr.gain.exponentialRampToValueAtTime(0.0001, now + 5);
      };

      //adsr swell 3
      const adsrSwell3 = function () {
        mainOsc3.frequency.value = Math.Random() * 200 + 100;

        ctx.resume();
        let now = ctx.currentTime;

        adsr.gain.setValueAtTime(0, now);
        adsr.gain.linearRampToValueAtTime(1, now + 1.5);
        adsr.gain.exponentialRampToValueAtTime(0.0001, now + 5);
      };

      // 1. Initialize the Audio Context
      const ctx = new AudioContext();

      // 2. Create the main audio source (e.g., a sawtooth wave)
      const mainOsc1 = new OscillatorNode(ctx);
      mainOsc1.type = "sawtooth";

      // 3. Create the Low-Pass Filter
      const lpFilter1 = new BiquadFilterNode(ctx);
      lpFilter1.type = "lowpass";
      lpFilter1.frequency = 200; // Base cutoff frequency
      lpFilter1.Q = 8; // Add resonance for a more noticeable sweep

      // 4. Create the LFO (Low Frequency Oscillator)
      const lfo1 = new OscillatorNode(ctx);
      lfo1.type = "square";
      lfo1.frequency.value = 6; // Speed of modulation (3 Hz / 3 times per second)

      // 5. Create the LFO Gain Node to control modulation depth
      const lfo1Depth = new GainNode(ctx);
      lfo1Depth.gain.value = 10000;

      // 6. Connect the modulation graph
      lfo1.connect(lfo1Depth);
      lfo1Depth.connect(lpFilter1.frequency); // Target the filter's frequency parameter

      const adsr = new GainNode(ctx);
      adsr.gain.value = 0;

      const master = new GainNode(ctx);

      // 7. Connect the main audio signal path
      mainOsc1.connect(lpFilter1);
      lpFilter1.connect(adsr);
      adsr.connect(master);
      master.connect(ctx.destination);

      // 8. Start both oscillators
      mainOsc1.start();
      lfo1.start();

      const slider1 = document.querySelector("#freq");
      slider1.addEventListener("input", () => {
        ctx.resume();
        lfo1Depth.gain.value = 100 * Number(slider1.value);
        document.querySelector("#CutOff_Display").textContent = slider1.value;
      });
      const slider2 = document.querySelector("#rate");
      slider2.addEventListener("input", () => {
        ctx.resume();
        lfo1.frequency.value = Number(slider2.value);
        document.querySelector("#Rate_Display").textContent = slider2.value;
      });

      const theClickButton = document.querySelector("#Start1");
      const theClickButton2 = document.querySelector("#Start2");
      const theClickButton3 = document.querySelector("#Start3");

      theClickButton.addEventListener("click", adsrSwell1);
      theClickButton.addEventListener("click", adsrSwell2);
      theClickButton.addEventListener("click", adsrSwell3);
    </script>
  </body>
</html>
